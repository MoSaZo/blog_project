{% extends 'parent/base.html' %}
{% load static %}
{% block title %}post_list{% endblock %}

{% block content %}
      <center>
         <p style="font-size: 16px;color: #444;"> post_list</p>
      </center>
      <hr>
      <div class="container">
         <div class="row">

             {% for post in posts %}
             <div class="col-md-3">
               <a href="{{ post.get_absolute_url }}">
               {# <a href="{% url 'blog:post_detail' post.slug %}"> #}
                  <div class="post-content" dir="auto">
                     <figure>
                        <img src="{% static 'img/Django-Projects.jpg' %}">
                        <figcaption class="hover-fig">
                           <i class="fa fa-plus"></i>
                        </figcaption>
                        <figcaption class="date-fig">
                           <span style="display:block;text-align:center">{{post.title}}</span>
                           <i class="fa fa-d ate"></i>
                        </figcaption>
                     </figure>
                     <p>{{ post.content | truncatewords:3 }}</p>
                  </div>
               </a>
            </div>
             {% endfor %}


         </div>
         <br>
         <div class="pagin text-center">
            <ul class="pagination">
               <li><a href="#">1</a></li>
               <li><a href="#">2</a></li>
               <li><a href="#">3</a></li>
               <li><a href="#">4</a></li>
               <li><a href="#">5</a></li>
            </ul>
         </div>
      </div>
{% endblock %}
